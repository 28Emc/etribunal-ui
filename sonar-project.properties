# eTribunal UI — configuración del análisis SonarQube
#
# El scanner (script package.json: `pnpm run sonar`) corre desde esta carpeta
# y lee este archivo. El token va por variable de entorno (SONAR_TOKEN) y el
# servidor por SONAR_HOST_URL (default http://localhost:9000).

sonar.projectKey=etribunal-ui
sonar.projectName=eTribunal UI
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.d.ts,src/setupTests.ts
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.d.ts,src/setupTests.ts

sonar.typescript.tsconfigPath=tsconfig.app.json

# Reporte LCOV generado por vitest (@vitest/coverage-v8, config en vite.config.ts)
sonar.javascript.lcov.reportPaths=coverage/lcov.info